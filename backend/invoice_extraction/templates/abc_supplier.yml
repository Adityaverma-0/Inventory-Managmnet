issuer: ABC Supplier
keywords:
  - ABC Supplier
  - INVOICE
fields:
  invoice_number: 'Invoice Number:\s*(INV-\d+-\d+)'
  date: 'Date:\s*(\d{4}-\d{2}-\d{2})'
  amount: 'Total:\s*(\d+)'
lines:
  start: 'Product\s+Qty\s+Unit\s+Price\s+Total'
  end: 'Total:'
  line: '(?P<description>\w+)\s+(?P<qty>\d+)\s+(?P<unit>\w+)\s+(?P<price>\d+)\s+(?P<line_amount>\d+)'
